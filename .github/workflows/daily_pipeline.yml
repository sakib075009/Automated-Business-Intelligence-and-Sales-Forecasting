name: Daily BI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-bi-pipeline
  cancel-in-progress: false

jobs:
  validate-and-analyze:
    name: Validate Data and Run Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib openpyxl scikit-learn scipy seaborn statsmodels PyYAML
          python -c "import pandas, numpy; print('pandas:', pandas.__version__); print('numpy:', numpy.__version__)"

      - name: Validate source data
        run: python src/data_validation.py

      - name: Run analytics and forecasting
        run: python src/analytics_engine.py

      - name: Upload analytics outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bi-analytics-outputs
          path: data/outputs/
          if-no-files-found: warn
          retention-days: 14