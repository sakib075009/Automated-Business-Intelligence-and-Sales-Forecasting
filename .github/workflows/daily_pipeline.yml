
name: Daily BI Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: daily-bi-pipeline
  cancel-in-progress: false

jobs:
  validate-and-analyze:
    name: Generate, Validate, Analyze, and Persist
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib openpyxl scikit-learn scipy seaborn statsmodels PyYAML
          python -c "import pandas, numpy; print('pandas:', pandas.__version__); print('numpy:', numpy.__version__)"

      - name: Validate source data
        run: python src/data_validation.py

      - name: Generate incremental synthetic sales
        run: python src/incremental_data_generator.py --apply

      - name: Validate updated source data
        run: python src/data_validation.py

      - name: Run complete analytics pipeline
        run: python src/run_analytics_pipeline.py

      - name: Upload analytics outputs
        uses: actions/upload-artifact@v7
        with:
          name: bi-analytics-outputs
          path: data/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Persist updated synthetic data and generator state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fact_sales.csv data/raw/dim_date.csv
          git add -f data/raw/incremental_generator_state.json

          if git diff --cached --quiet; then
            echo "No data or generator-state changes to persist."
          else
            git commit -m "Update synthetic sales data [skip ci]"
            git push origin HEAD:main
          fi
